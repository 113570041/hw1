<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際守衛｜太空射擊</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#050817;color:#eaf5ff;font-family:system-ui,sans-serif;overflow:hidden}main{height:100vh;display:grid;place-items:center;padding:12px}.game{position:relative;width:min(900px,100%);height:min(650px,100%);border:1px solid #29466f;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#142958,#050817 70%);box-shadow:0 0 50px #174a8540}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:16px 18px auto;display:flex;justify-content:space-between;font-weight:700;letter-spacing:.06em;text-shadow:0 0 10px #62caff;pointer-events:none}.hud span{color:#6ae5ff}.sound{position:absolute;right:16px;top:48px;border:1px solid #56779c;background:#0b1730cc;color:white;border-radius:20px;padding:7px 12px;cursor:pointer}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#030817b8;text-align:center;padding:24px}.overlay[hidden]{display:none}.card{max-width:460px}.card h1{font-size:clamp(2rem,6vw,3.5rem);margin:0 0 8px;color:#7ceaff;text-shadow:0 0 25px #25baff}.card p{line-height:1.7;color:#cedcf0}.action{padding:12px 28px;border:0;border-radius:24px;background:linear-gradient(100deg,#1ca8e8,#7958ef);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 0 22px #298bff66}.hint{font-size:.85rem!important;color:#9eb2cb!important}@media(max-width:500px){.hud{inset:12px;font-size:.85rem}.sound{top:45px;right:12px}}
    </style>
</head>
<body>
    <main>
        <section class="game" aria-label="星際射擊遊戲">
            <canvas id="canvas"></canvas>
            <div class="hud"><div>分數 <span id="score">0</span></div><div>生命 <span id="lives">❤❤❤</span></div></div>
            <button class="sound" id="sound" type="button">🔊 音效開</button>
            <div class="overlay" id="overlay"><div class="card"><h1>星際守衛</h1><p>駕駛戰機擊落隕石，守護星際航道！<br>使用 ← → 或 A / D 移動，空白鍵射擊。</p><button class="action" id="start" type="button">開始遊戲</button><p class="hint">手機可拖曳移動，點擊畫面射擊</p></div></div>
        </section>
    </main>
    <script>
    (()=>{
        const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),game=document.querySelector('.game');
        const scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),overlay=document.querySelector('#overlay');
        let w=0,h=0,ship,shots=[],rocks=[],particles=[],stars=[],score=0,lives=3,running=false,last=0,spawn=0,keys={},soundOn=true,audio;
        function resize(){const r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:90},()=>({x:Math.random()*w,y:Math.random()*h,size:.5+Math.random()*1.8,speed:15+Math.random()*55}))}
        function tone(freq,duration,type='sine',volume=.045){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(_){}}
        function reset(){score=0;lives=3;shots=[];rocks=[];particles=[];ship={x:w/2,y:h-65,cool:0};scoreEl.textContent=score;livesEl.textContent='❤❤❤';running=true;overlay.hidden=true;last=performance.now();requestAnimationFrame(loop)}
        function fire(){if(!running||ship.cool>0)return;shots.push({x:ship.x,y:ship.y-20});ship.cool=.2;tone(620,.09,'triangle',.025)}
        function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,v=30+Math.random()*130;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,time:.35+Math.random()*.45,color})}}
        function finish(){running=false;overlay.hidden=false;overlay.querySelector('h1').textContent='任務結束';overlay.querySelector('p').innerHTML=`最終分數：<b>${score}</b><br>再試一次，成為星際王牌！`;document.querySelector('#start').textContent='重新開始'}
        function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;ctx.clearRect(0,0,w,h);
            for(const s of stars){s.y+=s.speed*dt;if(s.y>h){s.y=0;s.x=Math.random()*w}ctx.fillStyle=`rgba(180,220,255,${.25+s.size/3})`;ctx.fillRect(s.x,s.y,s.size,s.size)}
            if(keys.ArrowLeft||keys.a||keys.A)ship.x-=300*dt;if(keys.ArrowRight||keys.d||keys.D)ship.x+=300*dt;ship.x=Math.max(18,Math.min(w-18,ship.x));ship.cool=Math.max(0,ship.cool-dt);if(keys[' '])fire();
            ctx.save();ctx.translate(ship.x,ship.y);ctx.fillStyle='#69e7ff';ctx.shadowColor='#39caff';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(17,16);ctx.lineTo(0,9);ctx.lineTo(-17,16);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.restore();
            spawn-=dt;if(spawn<=0){rocks.push({x:20+Math.random()*(w-40),y:-24,r:12+Math.random()*13,speed:75+Math.random()*65,spin:Math.random()*6});spawn=Math.max(.28,.8-score/1200)}
            for(const b of shots){b.y-=470*dt;ctx.fillStyle='#a4f6ff';ctx.shadowColor='#36dcff';ctx.shadowBlur=12;ctx.fillRect(b.x-2,b.y-9,4,13)}ctx.shadowBlur=0;shots=shots.filter(b=>b.y>-20);
            for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];r.y+=r.speed*dt;r.spin+=dt;ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.spin);ctx.fillStyle='#b27a69';ctx.strokeStyle='#ffbd8c';ctx.lineWidth=2;ctx.beginPath();for(let j=0;j<8;j++){const a=j*Math.PI/4,rad=r.r*(.78+Math.sin(j*7+r.spin)*.18);if(j===0)ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);else ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
                let hit=false;for(let j=shots.length-1;j>=0;j--){if(Math.hypot(shots[j].x-r.x,shots[j].y-r.y)<r.r+5){burst(r.x,r.y,'#ffbb70');rocks.splice(i,1);shots.splice(j,1);score+=10;scoreEl.textContent=score;tone(180,.16,'sawtooth');hit=true;break}}if(hit)continue;
                if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+13){burst(r.x,r.y,'#ff536c');rocks.splice(i,1);lives--;livesEl.textContent='❤'.repeat(lives)+'♡'.repeat(3-lives);tone(100,.35,'sawtooth',.07);if(lives<=0){finish();return}}
            }rocks=rocks.filter(r=>r.y<h+30);
            for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.time-=dt;ctx.globalAlpha=Math.max(0,p.time);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;particles=particles.filter(p=>p.time>0);requestAnimationFrame(loop)
        }
        document.querySelector('#start').addEventListener('click',()=>{overlay.querySelector('h1').textContent='星際守衛';overlay.querySelector('p').innerHTML='駕駛戰機擊落隕石，守護星際航道！<br>使用 ← → 或 A / D 移動，空白鍵射擊。';document.querySelector('#start').textContent='開始遊戲';reset();tone(440,.12)});
        document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音效開':'🔇 音效關';if(soundOn)tone(520,.1)});
        addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
        let dragging=false;canvas.addEventListener('pointerdown',e=>{dragging=true;move(e);fire()});canvas.addEventListener('pointermove',e=>{if(dragging)move(e)});addEventListener('pointerup',()=>dragging=false);
        function move(e){const r=canvas.getBoundingClientRect();if(ship)ship.x=(e.clientX-r.left)/r.width*w}
        addEventListener('resize',resize);resize();
    })();
    </script>
</body>
</html>
